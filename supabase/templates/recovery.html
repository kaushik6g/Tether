<h2>Reset your Tether password</h2>
<p>Use this code to choose a new password:</p>
<p><strong>{{ .Token }}</strong></p>
<p>Return to Tether. From Sign in, choose Forgot password, enter the email address that received this message, and choose I have a reset code.</p>
<p>If you did not request this code, you can ignore this message.</p>
